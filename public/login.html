<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Sign in to GaMon — Garbage Monitoring on Web" />
  <title>Sign In — GaMon</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <a class="nav-brand" href="index.html">Ga<span>Mon</span></a>
    <ul class="nav-links" id="nav-links" role="list">
      <li><a href="index.html">Home</a></li>
    </ul>
    <div class="nav-auth" id="nav-auth"></div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your GaMon account</p>

      <div class="alert" id="login-alert" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email <span class="required">*</span></label>
          <input class="form-input" type="email" id="email" name="email"
                 placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password <span class="required">*</span></label>
          <input class="form-input" type="password" id="password" name="password"
                 placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary btn-full" type="submit" id="btn-login">Sign in</button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <p>GaMon &mdash; Garbage Monitoring on Web &bull; <a href="index.html">Home</a></p>
  </footer>

  <script src="assets/js/auth.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="GaMon dashboard — waste statistics and charts" />
  <title>Dashboard — GaMon</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <a class="nav-brand" href="index.html">Ga<span>Mon</span></a>
    <ul class="nav-links" id="nav-links" role="list">
      <li><a href="index.html">Home</a></li>
      <li><a href="report.html">Reports</a></li>
      <li><a href="dashboard.html" class="active">Dashboard</a></li>
    </ul>
    <div class="nav-auth" id="nav-auth"></div>
  </nav>

  <main>
    <div class="container">

      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;padding:1.5rem 0 1rem">
        <h1 style="font-size:1.4rem;font-weight:700;color:var(--green-d)">Statistics Dashboard</h1>
        <div style="display:flex;gap:.4rem;align-items:center;flex-wrap:wrap">
          <div style="display:flex;gap:.25rem;margin-right:1rem">
            <button class="btn btn-sm btn-primary period-btn" data-period="all">All time</button>
            <button class="btn btn-sm btn-secondary period-btn" data-period="month">Month</button>
            <button class="btn btn-sm btn-secondary period-btn" data-period="week">Week</button>
            <button class="btn btn-sm btn-secondary period-btn" data-period="day">Today</button>
          </div>
          <div style="display:flex;gap:.4rem">
          <span style="font-size:.75rem;color:var(--muted);margin-right:.25rem">Export:</span>
          <a class="btn btn-sm btn-secondary" href="api/export.php?format=csv">CSV</a>
          <a class="btn btn-sm btn-secondary" href="api/export.php?format=json">JSON</a>
          <a class="btn btn-sm btn-secondary" href="api/export.php?format=html">HTML</a>
          <button class="btn btn-sm btn-secondary" id="btn-export-pdf">PDF</button>
          <div id="dashboard-import-section" style="display:none;align-items:center;margin-left:.5rem;gap:.4rem">
            <div style="border-left:1px solid var(--border);height:24px;margin-right:.25rem"></div>
            <span style="font-size:.75rem;color:var(--muted)">Import:</span>
            <label class="btn btn-sm btn-secondary" style="cursor:pointer">CSV <input type="file" accept=".csv" id="import-csv" hidden></label>
            <label class="btn btn-sm btn-secondary" style="cursor:pointer">JSON <input type="file" accept=".json" id="import-json" hidden></label>
          </div>
        </div>
      </div>
      </div>

      <!-- Stat tiles -->
      <div class="grid-3" style="margin-bottom:1.5rem">
        <div class="stat-tile">
          <span class="stat-value" id="d-total">—</span>
          <span class="stat-label">Total reports</span>
        </div>
        <div class="stat-tile">
          <span class="stat-value" id="d-open" style="color:#c44536">—</span>
          <span class="stat-label">Open reports</span>
        </div>
        <div class="stat-tile">
          <span class="stat-value" id="d-resolved" style="color:#2d6a4f">—</span>
          <span class="stat-label">Resolved reports</span>
        </div>
      </div>

      <div class="grid-2" style="margin-bottom:2rem; gap:1rem">
        <div class="stat-tile" style="border-left:4px solid #2d6a4f; background:#f4f9f6">
          <span class="stat-value" id="d-cleanest" style="font-size:1.1rem; color:#2d6a4f; margin-bottom:4px">—</span>
          <span class="stat-label">🌟 Cleanest City</span>
        </div>
        <div class="stat-tile" style="border-left:4px solid #c44536; background:#fdf2f1">
          <span class="stat-value" id="d-dirtiest" style="font-size:1.1rem; color:#c44536; margin-bottom:4px">—</span>
          <span class="stat-label">🚨 Dirtiest City</span>
        </div>
      </div>

      <!-- Charts -->
      <div class="grid-2" style="margin-bottom:1.5rem">
        <div class="card">
          <div class="card-header">Reports by category</div>
          <div class="card-body"><canvas id="chart-cat" height="220"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header">City ranking</div>
          <div class="card-body"><canvas id="chart-rank" height="220"></canvas></div>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <p>GaMon &mdash; Web Technologies 2026 &bull; <a href="docs/scholarly-report.html">Scholarly Report</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/dashboard.js" defer></script>
</body>
</html>
